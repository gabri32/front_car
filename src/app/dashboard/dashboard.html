<div class="dashboard-container">
  <div class="welcome">
    <span class="welcome-icon">🏍️</span>
    <h1>Bienvenido a ParkMoto</h1>
    <p>Selecciona una opción del menú lateral para comenzar.</p>
  </div>

  <div class="cards-grid">
    <a routerLink="/registro-moto" class="card">
      <div class="card-icon registro">🏍️</div>
      <div class="card-body">
        <h2>Registro de Motos</h2>
        <p>Registra una nueva moto con placa, cascos y gabeta.</p>
      </div>
    </a>

    <a routerLink="/estadisticas" class="card">
      <div class="card-icon estadisticas">📊</div>
      <div class="card-body">
        <h2>Estadísticas</h2>
        <p>Consulta el estado actual del parqueadero.</p>
      </div>
    </a>

    <a routerLink="/salida-moto" class="card">
      <div class="card-icon salida">🚪</div>
      <div class="card-body">
        <h2>Salida de Motos</h2>
        <p>Registra la salida de una moto del parqueadero.</p>
      </div>
    </a>
  </div>
</div>
