<div class="login-bg">
  <div class="login-card">

    <div class="login-icon">🏍️</div>
    <h1 class="login-titulo">PARKING</h1>
    <p class="login-sub">Sistema de parqueadero</p>

    <form (ngSubmit)="ingresar()" class="login-form">

      <div class="field">
        <label for="pwd">Contraseña de acceso</label>
        <div class="input-wrap">
          <input
            id="pwd"
            [type]="mostrar() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
          />
          <button type="button" class="toggle-pwd" (click)="mostrar.set(!mostrar())">
            {{ mostrar() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      @if (error()) {
        <div class="alert error">{{ error() }}</div>
      }

      <button type="submit" class="btn-ingresar">
        Ingresar al sistema
      </button>

    </form>

    <p class="login-nota">La sesión dura 12 horas</p>
  </div>
</div>
