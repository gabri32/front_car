<div class="page-container">
  <div class="page-header">
    <h2>Salida de Moto</h2>
  </div>

  <div class="card">
    <form (ngSubmit)="registrarSalida()" class="form">

      <div class="field">
        <label for="placa">Placa</label>
        <input
          id="placa"
          type="text"
          [(ngModel)]="placa"
          name="placa"
          placeholder="Ej: ABC123"
          autocomplete="off"
        />
      </div>

      @if (error()) {
        <div class="alert error">{{ error() }}</div>
      }

      @if (mensaje()) {
        <div class="alert success">{{ mensaje() }}</div>
      }

      <button type="submit" [disabled]="cargando()" class="btn-submit">
        {{ cargando() ? 'Procesando...' : 'Registrar Salida' }}
      </button>

    </form>
  </div>
</div>
